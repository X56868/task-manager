<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理器 - 谢飞跃</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; color: white; margin-bottom: 30px; }
    .header h1 { font-size: 32px; margin-bottom: 8px; }
    .header p { opacity: 0.9; }
    .add-form {
      background: white; border-radius: 16px; padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 20px;
    }
    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0;
      border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #667eea; }
    select {
      padding: 12px 16px; border: 2px solid #e0e0e0;
      border-radius: 10px; font-size: 15px; outline: none; cursor: pointer;
    }
    button {
      padding: 12px 24px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.98); }
    .btn-add {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; width: 100%;
    }
    .filters { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .filter-btn { background: rgba(255,255,255,0.2); color: white; border: 2px solid rgba(255,255,255,0.3); }
    .filter-btn.active { background: white; color: #667eea; }
    .task-list {
      background: white; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden;
    }
    .task-item {
      display: flex; align-items: center; padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0; gap: 12px;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item.completed .task-title { text-decoration: line-through; color: #aaa; }
    .task-checkbox { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
    .task-title { flex: 1; font-size: 16px; }
    .priority-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .priority-高 { background: #ffebee; color: #c62828; }
    .priority-中 { background: #fff3e0; color: #e65100; }
    .priority-低 { background: #e8f5e9; color: #2e7d32; }
    .btn-delete { background: #ffebee; color: #c62828; padding: 8px 12px; font-size: 13px; }
    .empty-state { padding: 40px; text-align: center; color: #999; }
    .loading { text-align: center; color: white; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 任务管理器</h1>
      <p>我是谢飞跃 · 我的第一个全栈应用</p>
    </div>

    <div class="add-form">
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="要做什么？" />
        <select id="prioritySelect">
          <option value="高">高优先级</option>
          <option value="中" selected>中优先级</option>
          <option value="低">低优先级</option>
        </select>
      </div>
      <button class="btn-add" onclick="addTask()">+ 添加任务</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">待完成</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">已完成</button>
    </div>

    <div class="task-list" id="taskList">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://botgdhdddkumhrjpzpho.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Hj0lo3lSKIk0cMX2A3gvCw_S2wvQvDF';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentFilter = 'all';

    async function loadTasks() {
      const { data, error } = await supabase
        .from('tasks')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        document.getElementById('taskList').innerHTML = '<div class="empty-state">加载失败：' + error.message + '</div>';
        return;
      }
      renderTasks(data);
    }

    function renderTasks(tasks) {
      let filtered = tasks;
      if (currentFilter === 'pending') filtered = tasks.filter(t => !t.completed);
      if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);
      if (filtered.length === 0) {
        document.getElementById('taskList').innerHTML = '<div class="empty-state">暂无任务 🎉</div>';
        return;
      }
      document.getElementById('taskList').innerHTML = filtered.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}">
          <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}
            onchange="toggleTask(${task.id}, ${!task.completed})" />
          <span class="task-title">${task.title}</span>
          <span class="priority-badge priority-${task.priority}">${task.priority}</span>
          <button class="btn-delete" onclick="deleteTask(${task.id})">删除</button>
        </div>
      `).join('');
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      const priority = document.getElementById('prioritySelect').value;
      if (!title) return;
      const { error } = await supabase.from('tasks').insert([{ title, priority }]);
      if (error) { alert('添加失败：' + error.message); return; }
      input.value = '';
      loadTasks();
    }

    async function toggleTask(id, completed) {
      const { error } = await supabase.from('tasks').update({ completed }).eq('id', id);
      if (error) { alert('更新失败：' + error.message); return; }
      loadTasks();
    }

    async function deleteTask(id) {
      if (!confirm('确定要删除这条任务吗？')) return;
      const { error } = await supabase.from('tasks').delete().eq('id', id);
      if (error) { alert('删除失败：' + error.message); return; }
      loadTasks();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadTasks();
    }

    document.getElementById('taskInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks();
  </script>
</body>
</html>
